<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guardião - Contatos</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #0b1f3a;
        padding-bottom: 40px;
      }

      body.modal-aberto {
        overflow: hidden;
      }

      header {
        background: #0b1f3a;
        color: white;
        text-align: center;
        padding: 18px 15px;
      }

      .logo-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .logo-area img {
        height: 68px;
      }

      .logo-area span {
        font-size: 27px;
        font-weight: bold;
      }

      .container {
        max-width: 700px;
        margin: 18px auto;
        padding: 15px;
      }

      .voltar-topo {
        display: inline-block;
        margin-bottom: 14px;
        color: #0b1f3a;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
      }

      .voltar-topo:hover {
        text-decoration: underline;
      }

      .card {
        background: white;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
      }

      .icone {
        font-size: 36px;
        text-align: center;
        margin-bottom: 8px;
      }

      h2 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 22px;
      }

      .descricao {
        text-align: center;
        color: #666;
        line-height: 1.45;
        margin-bottom: 20px;
        font-size: 14px;
      }

      /* CONTATOS */

      .contato {
        background: #f5f7fb;
        border-radius: 14px;
        padding: 13px;
        margin-top: 10px;

        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .informacoes-contato {
        text-align: left;
        flex: 1;
        min-width: 0;
      }

      .informacoes-contato strong {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
      }

      .informacoes-contato span {
        color: #666;
        font-size: 13px;
        word-break: break-word;
      }

      .sem-contatos {
        text-align: center;
        color: #777;
        margin-top: 15px;
        font-size: 14px;
      }

      /* X PARA EXCLUIR */

      .botao-excluir {
        border: none;
        background: transparent;
        color: #b91c1c;

        width: 36px;
        height: 36px;

        border-radius: 50%;

        font-size: 24px;
        font-weight: bold;

        display: flex;
        align-items: center;
        justify-content: center;

        flex-shrink: 0;

        cursor: pointer;

        transition: 0.2s;
      }

      .botao-excluir:hover {
        background: #fff0f0;
      }

      /* BOTÕES */

      .botao {
        width: 100%;

        background: #0b1f3a;
        color: white;

        border: none;

        padding: 13px;

        border-radius: 30px;

        cursor: pointer;

        font-size: 14px;
        font-weight: bold;

        margin-top: 16px;
      }

      .botao:hover {
        transform: scale(1.02);
      }

      .botao-secundario {
        width: 100%;

        background: white;
        color: #0b1f3a;

        border: 2px solid #0b1f3a;

        padding: 12px;

        border-radius: 30px;

        cursor: pointer;

        font-size: 14px;
        font-weight: bold;

        margin-top: 10px;
      }

      /* FORMULÁRIO */

      .formulario {
        max-height: 0;
        opacity: 0;
        overflow: hidden;

        margin-top: 0;
        padding-top: 0;

        border-top: 1px solid transparent;

        pointer-events: none;

        transition:
          max-height 0.35s ease,
          opacity 0.25s ease,
          margin-top 0.35s ease,
          padding-top 0.35s ease,
          border-color 0.35s ease;
      }

      .formulario.ativo {
        max-height: 500px;
        opacity: 1;

        margin-top: 20px;
        padding-top: 20px;

        border-top-color: #e5e5e5;

        pointer-events: auto;
      }

      .campo {
        margin-bottom: 13px;
        text-align: left;
      }

      .campo label {
        display: block;

        margin-bottom: 6px;

        font-weight: bold;
        font-size: 13px;
      }

      .campo input {
        width: 100%;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 12px;

        font-size: 16px;

        outline: none;

        transition: 0.2s;
      }

      .campo input:focus {
        border-color: #0b1f3a;
      }

      /* ERROS */

      .campo input.erro {
        border-color: #d90429;
        background: #fffafa;
      }

      .mensagem-erro {
        display: none;

        margin-top: 5px;

        color: #c62828;

        font-size: 11px;
        font-weight: bold;
      }

      .mensagem-erro.ativa {
        display: block;
      }

      /* MODAL DE EXCLUSÃO */

      .modal-fundo {
        display: none;

        position: fixed;

        inset: 0;

        background: rgba(11, 31, 58, 0.45);

        align-items: center;
        justify-content: center;

        padding: 20px;

        z-index: 2000;
      }

      .modal-fundo.ativo {
        display: flex;
      }

      .modal {
        width: 100%;
        max-width: 360px;

        background: white;

        border-radius: 18px;

        padding: 22px;

        text-align: center;

        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
      }

      .modal-icone {
        font-size: 30px;
        margin-bottom: 8px;
      }

      .modal h3 {
        font-size: 18px;
        margin-bottom: 8px;
      }

      .modal p {
        color: #666;

        font-size: 13px;
        line-height: 1.45;

        margin-bottom: 18px;
      }

      .modal-nome {
        color: #0b1f3a;
        font-weight: bold;
      }

      .modal-botoes {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 8px;
      }

      .modal-cancelar,
      .modal-excluir {
        border: none;

        border-radius: 25px;

        padding: 11px;

        cursor: pointer;

        font-size: 12px;
        font-weight: bold;
      }

      .modal-cancelar {
        background: #eef2f7;
        color: #0b1f3a;
      }

      .modal-excluir {
        background: #d90429;
        color: white;
      }

      /* CELULAR */

      @media (max-width: 600px) {
        header {
          padding: 14px 12px;
        }

        .logo-area img {
          height: 58px;
        }

        .logo-area span {
          font-size: 24px;
        }

        .container {
          margin: 12px auto;
          padding: 12px;
        }

        .voltar-topo {
          font-size: 13px;
          margin-bottom: 10px;
        }

        .card {
          padding: 18px;
          border-radius: 18px;
        }

        .icone {
          font-size: 30px;
          margin-bottom: 6px;
        }

        h2 {
          font-size: 20px;
        }

        .descricao {
          font-size: 13px;
          margin-bottom: 16px;
        }

        .contato {
          padding: 11px;
          margin-top: 8px;
        }

        .informacoes-contato strong {
          font-size: 13px;
        }

        .informacoes-contato span {
          font-size: 12px;
        }

        .botao {
          margin-top: 14px;
          padding: 12px;
          font-size: 13px;
        }

        .modal {
          max-width: 330px;
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1 class="logo-area">
        <img src="imagens/logo.png" alt="Logo Guardião" />

        <span>Guardião</span>
      </h1>
    </header>

    <main class="container">
      <a href="painel.html" class="voltar-topo"> ← Voltar </a>

      <div class="card">
        <div class="icone">👥</div>

        <h2>Contatos de confiança</h2>

        <p class="descricao">
          Cadastre as pessoas que poderão receber seus alertas em uma situação
          de emergência.
        </p>

        <div id="listaContatos"></div>

        <button
          class="botao"
          id="botaoAdicionar"
          type="button"
          onclick="mostrarFormulario()"
        >
          + Adicionar contato
        </button>

        <!-- FORMULÁRIO -->

        <div class="formulario" id="formularioContato">
          <div class="campo">
            <label for="nomeContato"> Nome </label>

            <input
              type="text"
              id="nomeContato"
              placeholder="Nome do contato"
              oninput="removerErro('nomeContato', 'erroNome')"
            />

            <span class="mensagem-erro" id="erroNome">
              ⚠ Campo obrigatório
            </span>
          </div>

          <div class="campo">
            <label for="telefoneContato"> Telefone </label>

            <input
              type="tel"
              id="telefoneContato"
              placeholder="(11) 99999-9999"
              oninput="removerErro('telefoneContato', 'erroTelefone')"
            />

            <span class="mensagem-erro" id="erroTelefone">
              ⚠ Campo obrigatório
            </span>
          </div>

          <button class="botao" type="button" onclick="salvarContato()">
            Salvar contato
          </button>

          <button
            class="botao-secundario"
            type="button"
            onclick="cancelarFormulario()"
          >
            Cancelar
          </button>
        </div>
      </div>
    </main>

    <!-- MODAL DE EXCLUSÃO -->

    <div
      class="modal-fundo"
      id="modalExcluir"
      onclick="fecharModalPeloFundo(event)"
    >
      <div class="modal">
        <div class="modal-icone">⚠️</div>

        <h3>Excluir contato?</h3>

        <p>
          <span class="modal-nome" id="nomeContatoExcluir"></span>
          será removido dos seus contatos de confiança.
        </p>

        <div class="modal-botoes">
          <button
            class="modal-cancelar"
            type="button"
            onclick="fecharModalExcluir()"
          >
            Cancelar
          </button>

          <button
            class="modal-excluir"
            type="button"
            onclick="confirmarExclusao()"
          >
            Excluir
          </button>
        </div>
      </div>
    </div>

    <script>
      const chaveContatos = "contatosGuardiao";

      const chaveContatosSelecionados = "contatosSelecionadosGuardiao";

      let indiceParaExcluir = null;

      /* OBTER CONTATOS */

      function obterContatos() {
        return JSON.parse(localStorage.getItem(chaveContatos)) || [];
      }

      /* SALVAR CONTATOS */

      function salvarContatos(contatos) {
        localStorage.setItem(chaveContatos, JSON.stringify(contatos));
      }

      /* CARREGAR CONTATOS */

      function carregarContatos() {
        const contatos = obterContatos();

        const lista = document.getElementById("listaContatos");

        const botaoAdicionar = document.getElementById("botaoAdicionar");

        lista.innerHTML = "";

        if (contatos.length === 0) {
          lista.innerHTML = `
            <p class="sem-contatos">
              Nenhum contato cadastrado.
            </p>
          `;

          botaoAdicionar.textContent = "+ Adicionar contato";

          return;
        }

        contatos.forEach(function (contato, indice) {
          const elemento = document.createElement("div");

          elemento.className = "contato";

          elemento.innerHTML = `
              <div class="informacoes-contato">

                <strong>
                  ${contato.nome}
                </strong>

                <span>
                  ${contato.telefone}
                </span>

              </div>

              <button
                class="botao-excluir"
                type="button"
                onclick="abrirModalExcluir(${indice})"
                title="Excluir ${contato.nome}"
                aria-label="Excluir ${contato.nome}"
              >
                ×
              </button>
            `;

          lista.appendChild(elemento);
        });

        botaoAdicionar.textContent = "+ Adicionar outro contato";
      }

      /* ABRIR FORMULÁRIO */

      function mostrarFormulario() {
        limparErros();

        const formulario = document.getElementById("formularioContato");

        formulario.classList.add("ativo");

        document.getElementById("botaoAdicionar").style.display = "none";

        /*
          Pequeno atraso para o navegador
          iniciar a animação antes do foco.
        */

        setTimeout(function () {
          document.getElementById("nomeContato").focus();
        }, 250);
      }

      /* CANCELAR FORMULÁRIO */

      function cancelarFormulario() {
        limparFormulario();

        limparErros();

        document.getElementById("formularioContato").classList.remove("ativo");

        document.getElementById("botaoAdicionar").style.display = "block";
      }

      /* LIMPAR FORMULÁRIO */

      function limparFormulario() {
        document.getElementById("nomeContato").value = "";

        document.getElementById("telefoneContato").value = "";
      }

      /* MOSTRAR ERRO */

      function mostrarErro(campoId, erroId) {
        document.getElementById(campoId).classList.add("erro");

        document.getElementById(erroId).classList.add("ativa");
      }

      /* REMOVER ERRO */

      function removerErro(campoId, erroId) {
        const campo = document.getElementById(campoId);

        if (campo.value.trim() !== "") {
          campo.classList.remove("erro");

          document.getElementById(erroId).classList.remove("ativa");
        }
      }

      /* LIMPAR ERROS */

      function limparErros() {
        document.getElementById("nomeContato").classList.remove("erro");

        document.getElementById("telefoneContato").classList.remove("erro");

        document.getElementById("erroNome").classList.remove("ativa");

        document.getElementById("erroTelefone").classList.remove("ativa");
      }

      /* SALVAR NOVO CONTATO */

      function salvarContato() {
        const campoNome = document.getElementById("nomeContato");

        const campoTelefone = document.getElementById("telefoneContato");

        const nome = campoNome.value.trim();

        const telefone = campoTelefone.value.trim();

        let formularioValido = true;

        if (nome === "") {
          mostrarErro("nomeContato", "erroNome");

          formularioValido = false;
        }

        if (telefone === "") {
          mostrarErro("telefoneContato", "erroTelefone");

          formularioValido = false;
        }

        if (!formularioValido) {
          if (nome === "") {
            campoNome.focus();
          } else {
            campoTelefone.focus();
          }

          return;
        }

        const contatos = obterContatos();

        contatos.push({
          nome: nome,
          telefone: telefone,
        });

        salvarContatos(contatos);

        limparFormulario();

        limparErros();

        document.getElementById("formularioContato").classList.remove("ativo");

        document.getElementById("botaoAdicionar").style.display = "block";

        carregarContatos();
      }

      /* ABRIR CONFIRMAÇÃO DE EXCLUSÃO */

      function abrirModalExcluir(indice) {
        const contatos = obterContatos();

        if (!contatos[indice]) {
          return;
        }

        indiceParaExcluir = indice;

        document.getElementById("nomeContatoExcluir").textContent =
          contatos[indice].nome;

        document.getElementById("modalExcluir").classList.add("ativo");

        document.body.classList.add("modal-aberto");
      }

      /* FECHAR CONFIRMAÇÃO */

      function fecharModalExcluir() {
        document.getElementById("modalExcluir").classList.remove("ativo");

        document.body.classList.remove("modal-aberto");

        indiceParaExcluir = null;
      }

      /* FECHAR AO TOCAR FORA */

      function fecharModalPeloFundo(event) {
        if (event.target.id === "modalExcluir") {
          fecharModalExcluir();
        }
      }

      /* CONFIRMAR EXCLUSÃO */

      function confirmarExclusao() {
        if (indiceParaExcluir === null) {
          return;
        }

        const contatos = obterContatos();

        const contato = contatos[indiceParaExcluir];

        if (!contato) {
          fecharModalExcluir();

          return;
        }

        /*
          Remove também o contato
          da seleção salva.
        */

        const telefoneNormalizado = String(contato.telefone || "").replace(
          /\D/g,
          "",
        );

        const selecionados =
          JSON.parse(localStorage.getItem(chaveContatosSelecionados)) || [];

        const selecionadosAtualizados = selecionados.filter(
          function (telefone) {
            return telefone !== telefoneNormalizado;
          },
        );

        localStorage.setItem(
          chaveContatosSelecionados,
          JSON.stringify(selecionadosAtualizados),
        );

        /*
          Remove o contato da lista.
        */

        contatos.splice(indiceParaExcluir, 1);

        salvarContatos(contatos);

        fecharModalExcluir();

        carregarContatos();
      }

      carregarContatos();
    </script>
  </body>
</html>
