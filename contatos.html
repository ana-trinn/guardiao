<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contatos | Guardião</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <div class="simbolo">🛡️</div>

      <h1>Contatos de confiança</h1>

      <p>Adicione as pessoas que receberão seus pedidos de ajuda.</p>

      <form id="formContato">
        <div class="campo">
          <label for="nomeContato">Nome</label>

          <input
            type="text"
            id="nomeContato"
            placeholder="Nome do contato"
            required
          />
        </div>

        <div class="campo">
          <label for="telefoneContato">Telefone</label>

          <input
            type="tel"
            id="telefoneContato"
            placeholder="(00) 00000-0000"
            required
          />
        </div>

        <div class="campo">
          <label for="relacaoContato">Relação</label>

          <select id="relacaoContato">
            <option value="">Selecione</option>

            <option value="Família">Família</option>

            <option value="Amigo(a)">Amigo(a)</option>

            <option value="Parceiro(a)">Parceiro(a)</option>

            <option value="Outro">Outro</option>
          </select>
        </div>

        <button type="submit">Adicionar contato</button>
      </form>

      <section class="lista-contatos">
        <h2>Seus contatos</h2>

        <div id="listaContatos"></div>
      </section>

      <a href="emergencia.html" class="link-botao">
        <button type="button" class="botao-continuar">Continuar</button>
      </a>
    </main>

    <script src="script.js"></script>
  </body>
</html>
