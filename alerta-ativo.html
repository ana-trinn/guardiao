<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guardião - Alerta Ativo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #0b1f3a;
            padding-bottom: 40px;
        }

        header {
            background: #0b1f3a;
            color: white;
            text-align: center;
            padding: 18px 15px;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .logo-area img {
            height: 68px;
        }

        .logo-area span {
            font-size: 27px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 18px auto;
            padding: 15px;
        }

        .voltar-topo {
            display: inline-block;
            margin-bottom: 12px;
            text-decoration: none;
            color: #0b1f3a;
            font-size: 14px;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .07);
        }

        .titulo-alerta {
            text-align: center;
            color: #d90429;
            margin-bottom: 16px;
            font-size: 22px;
        }

        .status-item {
            background: #f7f9fc;
            border-radius: 14px;
            padding: 13px;
            margin-bottom: 9px;
        }

        .status-item strong {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .texto-secundario {
            color: #666;
            font-size: 13px;
            line-height: 1.4;
        }

        /* MAPA */

        .mapa-area {
            margin-top: 9px;
        }

        .botao-mapa {
            display: inline-block;
            width: 100%;
            text-decoration: none;
            background: #0b1f3a;
            color: white;
            padding: 11px 15px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
        }

        /* SELEÇÃO */

        .selecao-contato {
            margin-top: 14px;
            padding: 14px;
            background: #f7f9fc;
            border-radius: 14px;
        }

        .selecao-contato label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .selecao-contato select {
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 11px;
            padding: 11px;
            font-size: 13px;
            background: white;
            color: #0b1f3a;
        }

        /* STATUS DOS CONTATOS */

        .ajudas-lista {
            margin-top: 14px;
        }

        .ajuda-item {
            background: #eef8f0;
            border: 1px solid #cde8d3;
            border-radius: 13px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .ajuda-item strong {
            display: block;
            color: #1b5e20;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .aguardando {
            background: #fffaf0;
            border: 1px solid #f3dfaa;
        }

        .aguardando strong {
            color: #8a6500;
        }

        /* BOTÕES */

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
        }

        .botao {
            border: none;
            border-radius: 30px;
            padding: 12px 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            width: 100%;
        }

        .botao-ajudar {
            background: #1b5e20;
            color: white;
        }

        .botao-chat {
            background: #0b1f3a;
            color: white;
        }

        .botao-localizacao {
            background: #eef2f7;
            color: #0b1f3a;
        }

        .botao-encerrar {
            background: #fff1f1;
            color: #b91c1c;
            border: 1px solid #e5bcbc;
        }

        /* MENSAGENS */

        .mensagem {
            display: none;
            margin-top: 10px;
            padding: 11px;
            border-radius: 13px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
        }

        .mensagem-sucesso {
            background: #eef8f0;
            color: #1b5e20;
        }

        .mensagem-encerrado {
            background: #f2f2f2;
            color: #555;
        }

        @media (max-width: 600px) {

            header {
                padding: 14px 12px;
            }

            .logo-area img {
                height: 58px;
            }

            .logo-area span {
                font-size: 24px;
            }

            .container {
                margin: 12px auto;
                padding: 12px;
            }

            .voltar-topo {
                font-size: 13px;
                margin-bottom: 9px;
            }

            .card {
                padding: 17px;
                border-radius: 18px;
            }

            .titulo-alerta {
                font-size: 19px;
                margin-bottom: 12px;
            }

            .status-item {
                padding: 11px;
            }

            .status-item strong {
                font-size: 13px;
            }

            .texto-secundario {
                font-size: 12px;
            }

            .selecao-contato {
                padding: 11px;
                margin-top: 11px;
            }

            .ajuda-item {
                padding: 10px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1 class="logo-area">

        <img
            src="imagens/logo.png"
            alt="Logo Guardião">

        <span>
            Guardião
        </span>

    </h1>

</header>


<main class="container">

    <a
        href="painel.html"
        class="voltar-topo">

        ← Voltar

    </a>


    <div class="card">

        <h2 class="titulo-alerta">
            🔴 Alerta em andamento
        </h2>


        <div class="status-item">

            <strong>
                🛡️ Pessoa que pediu ajuda
            </strong>

            <span class="texto-secundario">
                Usuário do Guardião
            </span>

        </div>


        <div class="status-item">

            <strong>
                📍 Localização compartilhada
            </strong>

            <span
                class="texto-secundario"
                id="statusLocalizacao">

                Carregando localização do alerta...

            </span>


            <div
                class="mapa-area"
                id="mapaArea"
                style="display: none;">

                <a
                    href="#"
                    target="_blank"
                    id="linkMapa"
                    class="botao-mapa">

                    📍 Abrir localização no mapa

                </a>

            </div>

        </div>


        <div class="status-item">

            <strong>
                👥 Contatos avisados
            </strong>

            <span
                class="texto-secundario"
                id="quantidadeContatos">

                Verificando contatos...

            </span>

        </div>


        <div class="selecao-contato">

            <label for="contatoRespondendo">
                Quem está respondendo ao alerta?
            </label>

            <select id="contatoRespondendo">

                <option value="">
                    Selecione um contato
                </option>

            </select>

        </div>


        <div class="botoes">

            <button
                class="botao botao-ajudar"
                onclick="aceitarAjuda()">

                🚗 Estou indo ajudar

            </button>

        </div>


        <div
            class="mensagem mensagem-sucesso"
            id="mensagemAjuda">

            ✅ Informação registrada.

        </div>


        <div
            class="ajudas-lista"
            id="listaStatusContatos">
        </div>


        <div class="botoes">

            <a
                href="chat.html"
                class="botao botao-chat">

                💬 Abrir chat de emergência

            </a>


            <button
                class="botao botao-localizacao"
                onclick="abrirLocalizacao()">

                📍 Ver localização

            </button>


            <button
                class="botao botao-encerrar"
                onclick="encerrarAlerta()">

                Encerrar alerta

            </button>

        </div>


        <div
            class="mensagem mensagem-encerrado"
            id="mensagemEncerrado">

            Alerta encerrado.

        </div>

    </div>

</main>


<script>

    const chaveChat =
        "mensagensChatGuardiao";


    const chaveAjudas =
        "ajudasGuardiao";


    let linkLocalizacao =
        "";


    function carregarDados() {

        carregarContatos();

        carregarLocalizacaoDoAlerta();

        atualizarListaStatus();

    }


    function carregarContatos() {

        const contatos =
            JSON.parse(
                localStorage.getItem(
                    "contatosGuardiao"
                )
            ) || [];


        const quantidade =
            document.getElementById(
                "quantidadeContatos"
            );


        const seletor =
            document.getElementById(
                "contatoRespondendo"
            );


        seletor.innerHTML = `
            <option value="">
                Selecione um contato
            </option>
        `;


        if (contatos.length === 0) {

            quantidade.textContent =
                "Nenhum contato cadastrado.";

            return;

        }


        quantidade.textContent =
            contatos.length === 1
                ? "1 contato de confiança avisado."
                : contatos.length +
                  " contatos de confiança avisados.";


        contatos.forEach(function(contato) {

            const opcao =
                document.createElement(
                    "option"
                );


            opcao.value =
                contato.nome;


            opcao.textContent =
                contato.nome;


            seletor.appendChild(
                opcao
            );

        });

    }


    function carregarLocalizacaoDoAlerta() {

        const elemento =
            document.getElementById(
                "statusLocalizacao"
            );


        const mapaArea =
            document.getElementById(
                "mapaArea"
            );


        const linkMapaElemento =
            document.getElementById(
                "linkMapa"
            );


        const localizacao =
            JSON.parse(
                localStorage.getItem(
                    "localizacaoAlertaGuardiao"
                )
            );


        if (!localizacao) {

            elemento.textContent =
                "Localização do alerta ainda não disponível.";

            mapaArea.style.display =
                "none";

            return;

        }


        linkLocalizacao =
            localizacao.linkMapa;


        elemento.innerHTML =
            localizacao.coordenadas +
            "<br>" +
            "Compartilhada às " +
            localizacao.horario;


        linkMapaElemento.href =
            localizacao.linkMapa;


        mapaArea.style.display =
            "block";

    }


    function abrirLocalizacao() {

        if (linkLocalizacao === "") {

            alert(
                "A localização do alerta ainda não está disponível."
            );

            return;

        }


        window.open(
            linkLocalizacao,
            "_blank"
        );

    }


    function aceitarAjuda() {

        const seletor =
            document.getElementById(
                "contatoRespondendo"
            );


        const nomeContato =
            seletor.value;


        if (nomeContato === "") {

            alert(
                "Selecione quem está respondendo ao alerta."
            );

            return;

        }


        let ajudas =
            JSON.parse(
                localStorage.getItem(
                    chaveAjudas
                )
            ) || [];


        const jaExiste =
            ajudas.some(
                function(item) {

                    return item.nome ===
                        nomeContato;

                }
            );


        if (jaExiste) {

            alert(
                nomeContato +
                " já informou que está indo ajudar."
            );

            return;

        }


        const horario =
            obterHoraAtual();


        const novaAjuda = {

            nome: nomeContato,

            horario: horario,

            status: "A caminho"

        };


        ajudas.push(
            novaAjuda
        );


        localStorage.setItem(

            chaveAjudas,

            JSON.stringify(
                ajudas
            )

        );


        registrarMensagemSistema(

            "🚗 " +
            nomeContato +
            " informou que está indo ajudar.",

            horario

        );


        document.getElementById(
            "mensagemAjuda"
        ).style.display =
            "block";


        setTimeout(function() {

            document.getElementById(
                "mensagemAjuda"
            ).style.display =
                "none";

        }, 2500);


        seletor.value = "";


        atualizarListaStatus();

    }


    function atualizarListaStatus() {

        const contatos =
            JSON.parse(
                localStorage.getItem(
                    "contatosGuardiao"
                )
            ) || [];


        const ajudas =
            JSON.parse(
                localStorage.getItem(
                    chaveAjudas
                )
            ) || [];


        const area =
            document.getElementById(
                "listaStatusContatos"
            );


        area.innerHTML = "";


        contatos.forEach(function(contato) {

            const ajuda =
                ajudas.find(
                    function(item) {

                        return item.nome ===
                            contato.nome;

                    }
                );


            const bloco =
                document.createElement(
                    "div"
                );


            if (ajuda) {

                bloco.className =
                    "ajuda-item";


                bloco.innerHTML = `

                    <strong>
                        🚗 ${contato.nome}
                    </strong>

                    <span class="texto-secundario">
                        A caminho • ${ajuda.horario}
                    </span>

                `;

            }

            else {

                bloco.className =
                    "ajuda-item aguardando";


                bloco.innerHTML = `

                    <strong>
                        👀 ${contato.nome}
                    </strong>

                    <span class="texto-secundario">
                        Ainda não informou se irá ajudar.
                    </span>

                `;

            }


            area.appendChild(
                bloco
            );

        });

    }


    function registrarMensagemSistema(
        texto,
        horario
    ) {

        const mensagens =
            JSON.parse(
                localStorage.getItem(
                    chaveChat
                )
            ) || [];


        mensagens.push({

            nome: "Sistema Guardião",

            texto: texto,

            tipo: "recebida",

            hora: horario

        });


        localStorage.setItem(

            chaveChat,

            JSON.stringify(
                mensagens
            )

        );

    }


    function obterHoraAtual() {

        return new Date()
            .toLocaleTimeString(

                "pt-BR",

                {
                    hour: "2-digit",
                    minute: "2-digit"
                }

            );

    }


    function encerrarAlerta() {

        const confirmar =
            confirm(
                "Deseja realmente encerrar este alerta?"
            );


        if (!confirmar) {

            return;

        }


        const horario =
            obterHoraAtual();


        registrarMensagemSistema(

            "✅ O alerta de emergência foi encerrado.",

            horario

        );


        localStorage.removeItem(
            chaveAjudas
        );


        localStorage.removeItem(
            "ajudaGuardiao"
        );


        localStorage.removeItem(
            "localizacaoAlertaGuardiao"
        );


        document.getElementById(
            "mensagemEncerrado"
        ).style.display =
            "block";


        document.getElementById(
            "listaStatusContatos"
        ).innerHTML = `

            <div class="ajuda-item">

                <strong>
                    ✅ Alerta encerrado
                </strong>

                <span class="texto-secundario">
                    Esta ocorrência foi finalizada.
                </span>

            </div>

        `;


        document.getElementById(
            "contatoRespondendo"
        ).disabled =
            true;

    }


    carregarDados();

</script>


</body>

</html>
