<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guardião - Chat de Emergência</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #0b1f3a;
        min-height: 100vh;
        padding-bottom: 30px;
        overflow-x: hidden;
      }

      header {
        background: #0b1f3a;
        color: white;
        text-align: center;
        padding: 12px;
      }

      .logo-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }

      .logo-area img {
        height: 52px;
      }

      .logo-area span {
        font-size: 22px;
        font-weight: bold;
      }

      .container {
        width: 100%;
        max-width: 560px;
        margin: 10px auto;
        padding: 12px;
      }

      .voltar-topo {
        display: inline-block;
        margin-bottom: 10px;
        text-decoration: none;
        color: #0b1f3a;
        font-size: 12px;
        font-weight: bold;
      }

      .chat-card {
        width: 100%;
        background: white;
        border-radius: 17px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
        overflow: hidden;
      }

      /* TOPO DO CHAT */

      .chat-topo {
        padding: 13px 14px;
        border-bottom: 1px solid #eee;
      }

      .chat-topo h2 {
        font-size: 17px;
        margin-bottom: 4px;
      }

      .chat-topo p {
        color: #666;
        font-size: 11px;
        line-height: 1.4;
      }

      .status-chat {
        display: inline-block;
        margin-top: 7px;
        padding: 4px 9px;
        border-radius: 20px;
        background: #fff1f1;
        color: #b91c1c;
        font-size: 10px;
        font-weight: bold;
      }

      /* MENSAGENS */

      .mensagens {
        height: 310px;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 13px;
        background: #f7f9fc;
      }

      .mensagem {
        width: fit-content;
        max-width: 76%;
        margin-bottom: 9px;
        padding: 8px 10px;
        border-radius: 13px;
        line-height: 1.35;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .mensagem-enviada {
        background: #0b1f3a;
        color: white;
        margin-left: auto;
        margin-right: 0;
        border-bottom-right-radius: 4px;
      }

      .mensagem-recebida {
        background: white;
        color: #333;
        border: 1px solid #ddd;
        margin-left: 0;
        margin-right: auto;
        border-bottom-left-radius: 4px;
      }

      .nome-remetente {
        display: block;
        font-size: 10px;
        font-weight: bold;
        margin-bottom: 3px;
      }

      .mensagem-enviada .nome-remetente {
        color: #dce7ff;
      }

      .mensagem-recebida .nome-remetente {
        color: #0b1f3a;
      }

      .hora {
        display: block;
        font-size: 9px;
        margin-top: 4px;
        opacity: 0.65;
      }

      /* ENTRADA DE MENSAGEM */

      .entrada-wrapper {
        position: relative;
        width: 100%;
      }

      .entrada-area {
        display: flex;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 10px 12px;
        border-top: 1px solid #eee;
        background: white;
      }

      .entrada-area input {
        flex: 1;
        min-width: 0;
        border: 1px solid #ccc;
        border-radius: 25px;
        padding: 8px 11px;
        font-size: 12px;
        outline: none;
      }

      .entrada-area input:focus {
        border-color: #0b1f3a;
      }

      .botao-emoji,
      .botao-enviar {
        border: none;
        width: 32px;
        height: 32px;
        min-width: 32px;
        flex: 0 0 32px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .botao-emoji {
        background: #eef2f7;
      }

      .botao-enviar {
        background: #0b1f3a;
        color: white;
      }

      /* EMOJIS */

      .painel-emojis {
        display: none;
        position: absolute;
        bottom: 54px;
        left: 12px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 13px;
        padding: 9px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        width: 205px;
        max-width: calc(100% - 24px);
        z-index: 10;
      }

      .grade-emojis {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 5px;
      }

      .emoji {
        border: none;
        background: transparent;
        font-size: 18px;
        cursor: pointer;
        padding: 2px;
        border-radius: 7px;
      }

      /* AÇÕES */

      .acoes {
        margin-top: 11px;
      }

      .botao-voltar {
        display: block;
        width: 100%;
        background: #0b1f3a;
        color: white;
        border: none;
        text-decoration: none;
        padding: 10px 12px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: bold;
        font-size: 11px;
        text-align: center;
      }

      /* MODO DEMONSTRAÇÃO */

      .demonstracao {
        margin-top: 10px;
        padding: 10px;
        border-radius: 13px;
        background: #eef2f7;
      }

      .demonstracao-topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
      }

      .demonstracao-topo strong {
        font-size: 11px;
      }

      .demonstracao-topo span {
        font-size: 11px;
        color: #666;
      }

      .demonstracao-conteudo {
        display: none;
        margin-top: 9px;
      }

      .botoes-demo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }

      .botao-simular,
      .limpar {
        width: 100%;
        border: none;
        padding: 9px;
        border-radius: 22px;
        cursor: pointer;
        font-weight: bold;
        font-size: 10px;
      }

      .botao-simular {
        background: white;
        color: #0b1f3a;
      }

      .limpar {
        background: #f5f5f5;
        color: #555;
      }

      .aviso {
        margin-top: 7px;
        color: #777;
        text-align: center;
        line-height: 1.35;
        font-size: 9px;
      }

      @media (max-width: 420px) {
        .container {
          padding: 10px 14px;
        }

        .mensagens {
          height: 300px;
        }

        .mensagem {
          max-width: 78%;
        }

        .botoes-demo {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1 class="logo-area">
        <img src="imagens/logo.png" alt="Logo Guardião" />

        <span> Guardião </span>
      </h1>
    </header>

    <main class="container">
      <a href="emergencia.html" class="voltar-topo"> ← Voltar ao alerta </a>

      <div class="chat-card">
        <!-- TOPO -->

        <div class="chat-topo">
          <h2>💬 Chat de Emergência</h2>

          <p>Converse com seus contatos durante o alerta.</p>

          <span class="status-chat"> 🔴 Alerta em andamento </span>
        </div>

        <!-- MENSAGENS -->

        <div class="mensagens" id="mensagensChat"></div>

        <!-- ENTRADA -->

        <div class="entrada-wrapper">
          <div class="painel-emojis" id="painelEmojis">
            <div class="grade-emojis">
              <button class="emoji" onclick="adicionarEmoji('😊')">😊</button>

              <button class="emoji" onclick="adicionarEmoji('❤️')">❤️</button>

              <button class="emoji" onclick="adicionarEmoji('👍')">👍</button>

              <button class="emoji" onclick="adicionarEmoji('🙏')">🙏</button>

              <button class="emoji" onclick="adicionarEmoji('😢')">😢</button>

              <button class="emoji" onclick="adicionarEmoji('😰')">😰</button>

              <button class="emoji" onclick="adicionarEmoji('🚨')">🚨</button>

              <button class="emoji" onclick="adicionarEmoji('📍')">📍</button>

              <button class="emoji" onclick="adicionarEmoji('🆘')">🆘</button>

              <button class="emoji" onclick="adicionarEmoji('👌')">👌</button>

              <button class="emoji" onclick="adicionarEmoji('✅')">✅</button>

              <button class="emoji" onclick="adicionarEmoji('❗')">❗</button>

              <button class="emoji" onclick="adicionarEmoji('🏠')">🏠</button>

              <button class="emoji" onclick="adicionarEmoji('🚗')">🚗</button>

              <button class="emoji" onclick="adicionarEmoji('📞')">📞</button>

              <button class="emoji" onclick="adicionarEmoji('💬')">💬</button>

              <button class="emoji" onclick="adicionarEmoji('👀')">👀</button>

              <button class="emoji" onclick="adicionarEmoji('💙')">💙</button>
            </div>
          </div>

          <div class="entrada-area">
            <button class="botao-emoji" type="button" onclick="abrirEmojis()">
              😊
            </button>

            <input
              type="text"
              id="campoMensagem"
              placeholder="Digite uma mensagem..."
              onkeydown="verificarEnter(event)"
            />

            <button
              class="botao-enviar"
              type="button"
              onclick="enviarMensagem()"
            >
              ➤
            </button>
          </div>
        </div>
      </div>

      <!-- VOLTAR -->

      <div class="acoes">
        <a href="emergencia.html" class="botao-voltar"> ← Voltar ao alerta </a>
      </div>

      <!-- MODO DEMONSTRAÇÃO -->

      <div class="demonstracao">
        <div class="demonstracao-topo" onclick="alternarDemonstracao()">
          <strong> 🧪 Modo demonstração </strong>

          <span id="iconeDemonstracao"> ▼ </span>
        </div>

        <div class="demonstracao-conteudo" id="demonstracaoConteudo">
          <div class="botoes-demo">
            <button class="botao-simular" onclick="simularResposta()">
              💬 Simular resposta
            </button>

            <button class="limpar" onclick="limparChat()">Limpar chat</button>
          </div>

          <div class="aviso">
            As respostas dos contatos são simuladas neste navegador.
          </div>
        </div>
      </div>
    </main>

    <script>
      const chaveChat = "mensagensChatGuardiao";

      const chavePerfil = "perfilGuardiao";

      function obterNomeUsuario() {
        const perfil = JSON.parse(localStorage.getItem(chavePerfil)) || {};

        if (perfil.nome && perfil.nome.trim() !== "") {
          return perfil.nome.trim() + " — pediu ajuda";
        }

        return "Você — pediu ajuda";
      }

      function carregarMensagens() {
        const mensagens = JSON.parse(localStorage.getItem(chaveChat)) || [];

        const area = document.getElementById("mensagensChat");

        area.innerHTML = "";

        mensagens.forEach(function (item) {
          adicionarMensagemNaTela(
            item.texto,

            item.tipo,

            item.hora,

            item.nome || obterNomeUsuario(),
          );
        });

        rolarChat();
      }

      function enviarMensagem() {
        const campo = document.getElementById("campoMensagem");

        const texto = campo.value.trim();

        if (texto === "") {
          return;
        }

        const hora = obterHoraAtual();

        const nomeUsuario = obterNomeUsuario();

        salvarMensagem({
          nome: nomeUsuario,

          texto: texto,

          tipo: "enviada",

          hora: hora,
        });

        adicionarMensagemNaTela(
          texto,

          "enviada",

          hora,

          nomeUsuario,
        );

        campo.value = "";

        campo.focus();

        document.getElementById("painelEmojis").style.display = "none";

        rolarChat();
      }

      function simularResposta() {
        const contatos =
          JSON.parse(localStorage.getItem("contatosGuardiao")) || [];

        if (contatos.length === 0) {
          alert("Cadastre pelo menos um contato para testar o chat.");

          return;
        }

        const contato = contatos[Math.floor(Math.random() * contatos.length)];

        const respostas = [
          "Estou indo até você. 🚗",

          "Onde você está agora? 📍",

          "Recebi seu alerta.",

          "Estou tentando falar com você.",

          "Fique onde está. Estou a caminho.",

          "Já estou chegando. 👍",

          "Você está bem?",

          "Vou pedir ajuda agora. 📞",
        ];

        const texto = respostas[Math.floor(Math.random() * respostas.length)];

        const hora = obterHoraAtual();

        salvarMensagem({
          nome: contato.nome,

          texto: texto,

          tipo: "recebida",

          hora: hora,
        });

        adicionarMensagemNaTela(
          texto,

          "recebida",

          hora,

          contato.nome,
        );

        rolarChat();
      }

      function salvarMensagem(mensagem) {
        const mensagens = JSON.parse(localStorage.getItem(chaveChat)) || [];

        mensagens.push(mensagem);

        localStorage.setItem(
          chaveChat,

          JSON.stringify(mensagens),
        );
      }

      function adicionarMensagemNaTela(texto, tipo, hora, nome) {
        const area = document.getElementById("mensagensChat");

        const mensagem = document.createElement("div");

        mensagem.className =
          "mensagem " +
          (tipo === "recebida" ? "mensagem-recebida" : "mensagem-enviada");

        const nomeElemento = document.createElement("span");

        nomeElemento.className = "nome-remetente";

        nomeElemento.textContent = nome;

        const textoElemento = document.createElement("div");

        textoElemento.textContent = texto;

        const horaElemento = document.createElement("span");

        horaElemento.className = "hora";

        horaElemento.textContent = hora;

        mensagem.appendChild(nomeElemento);

        mensagem.appendChild(textoElemento);

        mensagem.appendChild(horaElemento);

        area.appendChild(mensagem);
      }

      function abrirEmojis() {
        const painel = document.getElementById("painelEmojis");

        painel.style.display =
          painel.style.display === "block" ? "none" : "block";
      }

      function adicionarEmoji(emoji) {
        const campo = document.getElementById("campoMensagem");

        campo.value = campo.value + emoji;

        campo.focus();
      }

      function verificarEnter(event) {
        if (event.key === "Enter") {
          enviarMensagem();
        }
      }

      function obterHoraAtual() {
        return new Date().toLocaleTimeString(
          "pt-BR",

          {
            hour: "2-digit",
            minute: "2-digit",
          },
        );
      }

      function rolarChat() {
        const area = document.getElementById("mensagensChat");

        area.scrollTop = area.scrollHeight;
      }

      function limparChat() {
        const confirmar = confirm(
          "Deseja realmente apagar as mensagens deste chat?",
        );

        if (!confirmar) {
          return;
        }

        localStorage.removeItem(chaveChat);

        document.getElementById("mensagensChat").innerHTML = "";
      }

      function alternarDemonstracao() {
        const area = document.getElementById("demonstracaoConteudo");

        const icone = document.getElementById("iconeDemonstracao");

        if (area.style.display === "block") {
          area.style.display = "none";

          icone.textContent = "▼";
        } else {
          area.style.display = "block";

          icone.textContent = "▲";
        }
      }

      carregarMensagens();
    </script>
  </body>
</html>
