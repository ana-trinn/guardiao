<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Guardião - Chat de Emergência</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #0b1f3a;
        min-height: 100vh;
        padding-bottom: 25px;
      }

      /* CABEÇALHO */

      header {
        width: 100%;
        background: #0b1f3a;
        color: white;
        text-align: center;
        padding: 10px 12px;
      }

      .logo-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .logo-area img {
        height: 45px;
      }

      .logo-area span {
        font-size: 20px;
        font-weight: bold;
      }

      /* CONTAINER */

      .container {
        width: 100%;
        max-width: 540px;
        margin: 0 auto;
        padding: 10px 12px;
      }

      /* VOLTAR */

      .voltar-topo {
        display: inline-block;
        margin-bottom: 9px;
        text-decoration: none;
        color: #0b1f3a;
        font-size: 12px;
        font-weight: bold;
      }

      /* CHAT */

      .chat-card {
        width: 100%;
        max-width: 100%;
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.07);
      }

      /* TOPO DO CHAT */

      .chat-topo {
        padding: 12px 13px;
        border-bottom: 1px solid #eee;
      }

      .chat-topo-linha {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .chat-topo h2 {
        font-size: 15px;
        margin: 0;
      }

      .status-chat {
        flex-shrink: 0;
        padding: 4px 7px;
        border-radius: 20px;
        background: #fff1f1;
        color: #b91c1c;
        font-size: 9px;
        font-weight: bold;
      }

      .chat-topo p {
        color: #777;
        font-size: 10px;
        line-height: 1.35;
        margin-top: 5px;
      }

      /* ÁREA DE MENSAGENS */

      .mensagens {
        width: 100%;
        height: min(42dvh, 360px);
        min-height: 260px;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 12px;
        background: #f7f9fc;
        scroll-behavior: smooth;
      }

      /* BALÕES */

      .mensagem {
        width: max-content;
        max-width: 78%;
        padding: 8px 10px;
        margin-bottom: 9px;
        border-radius: 13px;
        font-size: 12px;
        line-height: 1.35;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .mensagem-enviada {
        margin-left: auto;
        margin-right: 0;
        background: #0b1f3a;
        color: white;
        border-bottom-right-radius: 4px;
      }

      .mensagem-recebida {
        margin-left: 0;
        margin-right: auto;
        background: white;
        color: #333;
        border: 1px solid #ddd;
        border-bottom-left-radius: 4px;
      }

      .nome-remetente {
        display: block;
        margin-bottom: 3px;
        font-size: 9px;
        font-weight: bold;
      }

      .mensagem-enviada .nome-remetente {
        color: #dce7ff;
      }

      .mensagem-recebida .nome-remetente {
        color: #0b1f3a;
      }

      .hora {
        display: block;
        margin-top: 4px;
        font-size: 8px;
        opacity: 0.65;
      }

      /* ÁREA DE DIGITAÇÃO */

      .entrada-wrapper {
        position: relative;
        width: 100%;
        max-width: 100%;
        background: white;
        border-top: 1px solid #eee;
      }

      .entrada-area {
        width: 100%;
        max-width: 100%;
        display: grid;

        grid-template-columns:
          34px
          minmax(0, 1fr)
          34px;

        align-items: center;
        gap: 7px;

        padding: 9px 10px;
      }

      .entrada-area input {
        display: block;
        width: 100%;
        min-width: 0;

        border: 1px solid #cdd2da;
        border-radius: 24px;

        padding: 9px 11px;

        font-size: 12px;
        color: #0b1f3a;

        outline: none;
      }

      .entrada-area input:focus {
        border-color: #0b1f3a;
      }

      .botao-emoji,
      .botao-enviar {
        width: 34px;
        height: 34px;

        border: none;
        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        font-size: 14px;
      }

      .botao-emoji {
        background: #eef2f7;
      }

      .botao-enviar {
        background: #0b1f3a;
        color: white;
      }

      /* PAINEL DE EMOJIS */

      .painel-emojis {
        display: none;

        position: absolute;

        left: 10px;
        bottom: 53px;

        width: 205px;
        max-width: calc(100% - 20px);

        background: white;

        border: 1px solid #ddd;
        border-radius: 13px;

        padding: 8px;

        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);

        z-index: 20;
      }

      .grade-emojis {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
      }

      .emoji {
        border: none;
        background: transparent;
        font-size: 18px;
        cursor: pointer;
        padding: 3px;
      }

      /* LINK VOLTAR */

      .voltar-abaixo {
        text-align: center;
        margin-top: 10px;
      }

      .voltar-abaixo a {
        display: inline-block;

        padding: 8px 14px;

        border-radius: 22px;

        color: #0b1f3a;
        background: #e8eef7;

        text-decoration: none;

        font-size: 11px;
        font-weight: bold;
      }

      /* DEMONSTRAÇÃO */

      .demonstracao {
        width: 100%;

        margin-top: 10px;

        padding: 9px 11px;

        background: #eef2f7;

        border-radius: 12px;
      }

      .demonstracao-topo {
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: space-between;

        cursor: pointer;
      }

      .demonstracao-topo strong {
        font-size: 10px;
      }

      .demonstracao-topo span {
        color: #666;
        font-size: 10px;
      }

      .demonstracao-conteudo {
        display: none;
        margin-top: 8px;
      }

      .botoes-demo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .botao-simular,
      .limpar {
        width: 100%;

        border: none;
        border-radius: 20px;

        padding: 8px;

        cursor: pointer;

        font-size: 9px;
        font-weight: bold;
      }

      .botao-simular {
        background: white;
        color: #0b1f3a;
      }

      .limpar {
        background: #f8f8f8;
        color: #555;
      }

      .aviso {
        margin-top: 6px;

        text-align: center;

        color: #777;

        font-size: 8px;
        line-height: 1.35;
      }

      /* CELULAR */

      @media (max-width: 480px) {
        header {
          padding: 8px;
        }

        .logo-area img {
          height: 40px;
        }

        .logo-area span {
          font-size: 18px;
        }

        .container {
          padding: 8px 10px;
        }

        .chat-topo {
          padding: 10px 11px;
        }

        .chat-topo h2 {
          font-size: 14px;
        }

        .mensagens {
          min-height: 270px;
          height: 43dvh;
          padding: 10px;
        }

        .mensagem {
          max-width: 80%;
        }

        .entrada-area {
          grid-template-columns:
            32px
            minmax(0, 1fr)
            32px;

          gap: 6px;

          padding: 8px;
        }

        .botao-emoji,
        .botao-enviar {
          width: 32px;
          height: 32px;
        }

        .entrada-area input {
          padding: 8px 10px;
          font-size: 12px;
        }
      }

      /* CELULAR PEQUENO */

      @media (max-width: 350px) {
        .status-chat {
          display: none;
        }

        .mensagem {
          max-width: 82%;
        }

        .botoes-demo {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo-area">
        <img src="imagens/logo.png" alt="Logo Guardião" />

        <span> Guardião </span>
      </div>
    </header>

    <main class="container">
      <a href="emergencia.html" class="voltar-topo"> ← Voltar ao alerta </a>

      <div class="chat-card">
        <!-- CABEÇALHO DO CHAT -->

        <div class="chat-topo">
          <div class="chat-topo-linha">
            <h2>💬 Chat de emergência</h2>

            <span class="status-chat"> 🔴 Alerta ativo </span>
          </div>

          <p>Converse com seus contatos durante a emergência.</p>
        </div>

        <!-- MENSAGENS -->

        <div class="mensagens" id="mensagensChat"></div>

        <!-- DIGITAÇÃO -->

        <div class="entrada-wrapper">
          <!-- EMOJIS -->

          <div class="painel-emojis" id="painelEmojis">
            <div class="grade-emojis">
              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('😊')"
              >
                😊
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('❤️')"
              >
                ❤️
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('👍')"
              >
                👍
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('🙏')"
              >
                🙏
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('😢')"
              >
                😢
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('😰')"
              >
                😰
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('🚨')"
              >
                🚨
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('📍')"
              >
                📍
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('🆘')"
              >
                🆘
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('👌')"
              >
                👌
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('✅')"
              >
                ✅
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('❗')"
              >
                ❗
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('🏠')"
              >
                🏠
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('🚗')"
              >
                🚗
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('📞')"
              >
                📞
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('💬')"
              >
                💬
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('👀')"
              >
                👀
              </button>

              <button
                class="emoji"
                type="button"
                onclick="adicionarEmoji('💙')"
              >
                💙
              </button>
            </div>
          </div>

          <div class="entrada-area">
            <button
              class="botao-emoji"
              type="button"
              onclick="abrirEmojis()"
              aria-label="Abrir emojis"
            >
              😊
            </button>

            <input
              type="text"
              id="campoMensagem"
              placeholder="Digite uma mensagem..."
              autocomplete="off"
              onkeydown="verificarEnter(event)"
            />

            <button
              class="botao-enviar"
              type="button"
              onclick="enviarMensagem()"
              aria-label="Enviar mensagem"
            >
              ➤
            </button>
          </div>
        </div>
      </div>

      <!-- VOLTAR -->

      <div class="voltar-abaixo">
        <a href="emergencia.html"> ← Voltar ao alerta </a>
      </div>

      <!-- DEMONSTRAÇÃO -->

      <div class="demonstracao">
        <div class="demonstracao-topo" onclick="alternarDemonstracao()">
          <strong> 🧪 Ferramentas de demonstração </strong>

          <span id="iconeDemonstracao"> ▼ </span>
        </div>

        <div class="demonstracao-conteudo" id="demonstracaoConteudo">
          <div class="botoes-demo">
            <button
              class="botao-simular"
              type="button"
              onclick="simularResposta()"
            >
              💬 Simular resposta
            </button>

            <button class="limpar" type="button" onclick="limparChat()">
              Limpar conversa
            </button>
          </div>

          <div class="aviso">
            As respostas são simuladas apenas para demonstração do protótipo.
          </div>
        </div>
      </div>
    </main>

    <script>
      const chaveChat = "mensagensChatGuardiao";

      const chavePerfil = "perfilGuardiao";

      function obterNomeUsuario() {
        const perfil = JSON.parse(localStorage.getItem(chavePerfil)) || {};

        if (perfil.nome && perfil.nome.trim() !== "") {
          return perfil.nome.trim() + " — pediu ajuda";
        }

        return "Você — pediu ajuda";
      }

      function carregarMensagens() {
        const mensagens = JSON.parse(localStorage.getItem(chaveChat)) || [];

        const area = document.getElementById("mensagensChat");

        area.innerHTML = "";

        mensagens.forEach(function (item) {
          adicionarMensagemNaTela(
            item.texto,

            item.tipo,

            item.hora,

            item.nome || obterNomeUsuario(),
          );
        });

        rolarChat();
      }

      function enviarMensagem() {
        const campo = document.getElementById("campoMensagem");

        const texto = campo.value.trim();

        if (texto === "") {
          return;
        }

        const hora = obterHoraAtual();

        const nomeUsuario = obterNomeUsuario();

        salvarMensagem({
          nome: nomeUsuario,

          texto: texto,

          tipo: "enviada",

          hora: hora,
        });

        adicionarMensagemNaTela(
          texto,

          "enviada",

          hora,

          nomeUsuario,
        );

        campo.value = "";

        document.getElementById("painelEmojis").style.display = "none";

        rolarChat();
      }

      function simularResposta() {
        const contatos =
          JSON.parse(localStorage.getItem("contatosGuardiao")) || [];

        if (contatos.length === 0) {
          alert("Cadastre pelo menos um contato para testar o chat.");

          return;
        }

        const contato = contatos[Math.floor(Math.random() * contatos.length)];

        const respostas = [
          "Estou indo até você. 🚗",

          "Onde você está agora? 📍",

          "Recebi seu alerta.",

          "Estou tentando falar com você.",

          "Fique onde está. Estou a caminho.",

          "Já estou chegando. 👍",

          "Você está bem?",

          "Vou pedir ajuda agora. 📞",
        ];

        const texto = respostas[Math.floor(Math.random() * respostas.length)];

        const hora = obterHoraAtual();

        salvarMensagem({
          nome: contato.nome,

          texto: texto,

          tipo: "recebida",

          hora: hora,
        });

        adicionarMensagemNaTela(
          texto,

          "recebida",

          hora,

          contato.nome,
        );

        rolarChat();
      }

      function salvarMensagem(mensagem) {
        const mensagens = JSON.parse(localStorage.getItem(chaveChat)) || [];

        mensagens.push(mensagem);

        localStorage.setItem(
          chaveChat,

          JSON.stringify(mensagens),
        );
      }

      function adicionarMensagemNaTela(texto, tipo, hora, nome) {
        const area = document.getElementById("mensagensChat");

        const mensagem = document.createElement("div");

        mensagem.className =
          "mensagem " +
          (tipo === "recebida" ? "mensagem-recebida" : "mensagem-enviada");

        const nomeElemento = document.createElement("span");

        nomeElemento.className = "nome-remetente";

        nomeElemento.textContent = nome;

        const textoElemento = document.createElement("div");

        textoElemento.textContent = texto;

        const horaElemento = document.createElement("span");

        horaElemento.className = "hora";

        horaElemento.textContent = hora;

        mensagem.appendChild(nomeElemento);

        mensagem.appendChild(textoElemento);

        mensagem.appendChild(horaElemento);

        area.appendChild(mensagem);
      }

      function abrirEmojis() {
        const painel = document.getElementById("painelEmojis");

        painel.style.display =
          painel.style.display === "block" ? "none" : "block";
      }

      function adicionarEmoji(emoji) {
        const campo = document.getElementById("campoMensagem");

        campo.value = campo.value + emoji;

        campo.focus();
      }

      function verificarEnter(event) {
        if (event.key === "Enter") {
          event.preventDefault();

          enviarMensagem();
        }
      }

      function obterHoraAtual() {
        return new Date().toLocaleTimeString(
          "pt-BR",

          {
            hour: "2-digit",
            minute: "2-digit",
          },
        );
      }

      function rolarChat() {
        const area = document.getElementById("mensagensChat");

        area.scrollTop = area.scrollHeight;
      }

      function limparChat() {
        const confirmar = confirm(
          "Deseja realmente apagar as mensagens deste chat?",
        );

        if (!confirmar) {
          return;
        }

        localStorage.removeItem(chaveChat);

        document.getElementById("mensagensChat").innerHTML = "";
      }

      function alternarDemonstracao() {
        const area = document.getElementById("demonstracaoConteudo");

        const icone = document.getElementById("iconeDemonstracao");

        if (area.style.display === "block") {
          area.style.display = "none";

          icone.textContent = "▼";
        } else {
          area.style.display = "block";

          icone.textContent = "▲";
        }
      }

      carregarMensagens();
    </script>
  </body>
</html>
