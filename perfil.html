<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Guardião - Perfil</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #0b1f3a;
        min-height: 100vh;
        padding-bottom: 40px;
      }

      header {
        background: #0b1f3a;
        color: white;
        text-align: center;
        padding: 14px 12px;
      }

      .logo-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .logo-area img {
        height: 58px;
      }

      .logo-area span {
        font-size: 24px;
        font-weight: bold;
      }

      .container {
        width: 100%;
        max-width: 620px;
        margin: 12px auto;
        padding: 14px;
      }

      .voltar-topo {
        display: inline-block;
        margin-bottom: 12px;
        color: #0b1f3a;
        text-decoration: none;
        font-size: 13px;
        font-weight: bold;
      }

      .card {
        background: white;
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
      }

      .icone {
        text-align: center;
        font-size: 36px;
        margin-bottom: 8px;
      }

      h2 {
        text-align: center;
        font-size: 21px;
        margin-bottom: 6px;
      }

      .descricao {
        text-align: center;
        color: #666;
        font-size: 13px;
        line-height: 1.45;
        margin-bottom: 20px;
      }

      .campo {
        margin-bottom: 14px;
      }

      .campo label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 6px;
      }

      .campo input,
      .campo textarea {
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 12px;
        padding: 12px;
        font-size: 14px;
        font-family: Arial, Helvetica, sans-serif;
        outline: none;
        transition: 0.2s;
      }

      .campo textarea {
        min-height: 90px;
        resize: vertical;
      }

      .campo input:focus,
      .campo textarea:focus {
        border-color: #0b1f3a;
      }

      .opcional {
        color: #777;
        font-size: 11px;
        font-weight: normal;
      }

      /* ERROS */

      .campo input.erro {
        border-color: #d90429;
        background: #fffafa;
      }

      .mensagem-erro {
        display: none;
        margin-top: 5px;
        color: #c62828;
        font-size: 11px;
        font-weight: bold;
      }

      .mensagem-erro.ativa {
        display: block;
      }

      /* AJUDA */

      .ajuda-campo {
        margin-top: 5px;
        color: #777;
        font-size: 11px;
        line-height: 1.4;
      }

      .botao {
        width: 100%;
        border: none;
        border-radius: 30px;
        padding: 13px;
        background: #0b1f3a;
        color: white;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        margin-top: 6px;
      }

      .mensagem-sucesso {
        display: none;
        margin-top: 14px;
        padding: 11px;
        border-radius: 12px;
        background: #eef8f0;
        color: #1b5e20;
        text-align: center;
        font-size: 12px;
        font-weight: bold;
      }

      @media (max-width: 600px) {
        .container {
          padding: 12px;
        }

        .card {
          padding: 18px;
        }

        .icone {
          font-size: 30px;
        }

        h2 {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo-area">
        <img src="imagens/logo.png" alt="Logo Guardião" />

        <span> Guardião </span>
      </div>
    </header>

    <main class="container">
      <a href="configuracoes.html" class="voltar-topo"> ← Voltar </a>

      <div class="card">
        <div class="icone">👤</div>

        <h2>Meu perfil</h2>

        <p class="descricao">
          Cadastre seus dados para que o Guardião possa identificar corretamente
          quem iniciou um alerta.
        </p>

        <!-- NOME -->

        <div class="campo">
          <label for="nomeUsuario"> Nome </label>

          <input
            type="text"
            id="nomeUsuario"
            placeholder="Digite seu nome"
            oninput="removerErro('nomeUsuario', 'erroNome')"
          />

          <span class="mensagem-erro" id="erroNome"> ⚠ Campo obrigatório </span>
        </div>

        <!-- TELEFONE -->

        <div class="campo">
          <label for="telefoneUsuario"> Telefone </label>

          <input
            type="tel"
            id="telefoneUsuario"
            placeholder="(11) 99999-9999"
            oninput="removerErro('telefoneUsuario', 'erroTelefone')"
          />

          <span class="mensagem-erro" id="erroTelefone">
            ⚠ Campo obrigatório
          </span>
        </div>

        <!-- INFORMAÇÃO DE EMERGÊNCIA -->

        <div class="campo">
          <label for="informacaoEmergencia">
            Informação para emergência

            <span class="opcional"> (opcional) </span>
          </label>

          <textarea
            id="informacaoEmergencia"
            placeholder="Ex.: estou sendo seguida, preciso de ajuda para chegar a um local seguro..."
          ></textarea>

          <div class="ajuda-campo">
            Essa informação poderá aparecer na mensagem de emergência.
          </div>
        </div>

        <button class="botao" onclick="salvarPerfil()">Salvar perfil</button>

        <div class="mensagem-sucesso" id="mensagemSucesso">
          ✅ Perfil salvo com sucesso.
        </div>
      </div>
    </main>

    <script>
      const chavePerfil = "perfilGuardiao";

      function carregarPerfil() {
        const perfil = JSON.parse(localStorage.getItem(chavePerfil));

        if (!perfil) {
          return;
        }

        document.getElementById("nomeUsuario").value = perfil.nome || "";

        document.getElementById("telefoneUsuario").value =
          perfil.telefone || "";

        document.getElementById("informacaoEmergencia").value =
          perfil.informacaoEmergencia || "";
      }

      function mostrarErro(campoId, erroId) {
        document.getElementById(campoId).classList.add("erro");

        document.getElementById(erroId).classList.add("ativa");
      }

      function removerErro(campoId, erroId) {
        const campo = document.getElementById(campoId);

        if (campo.value.trim() !== "") {
          campo.classList.remove("erro");

          document.getElementById(erroId).classList.remove("ativa");
        }
      }

      function limparErros() {
        document.getElementById("nomeUsuario").classList.remove("erro");

        document.getElementById("telefoneUsuario").classList.remove("erro");

        document.getElementById("erroNome").classList.remove("ativa");

        document.getElementById("erroTelefone").classList.remove("ativa");
      }

      function salvarPerfil() {
        const campoNome = document.getElementById("nomeUsuario");

        const campoTelefone = document.getElementById("telefoneUsuario");

        const nome = campoNome.value.trim();

        const telefone = campoTelefone.value.trim();

        const informacaoEmergencia = document
          .getElementById("informacaoEmergencia")
          .value.trim();

        let formularioValido = true;

        /* VALIDAR NOME */

        if (nome === "") {
          mostrarErro("nomeUsuario", "erroNome");

          formularioValido = false;
        }

        /* VALIDAR TELEFONE */

        if (telefone === "") {
          mostrarErro("telefoneUsuario", "erroTelefone");

          formularioValido = false;
        }

        if (!formularioValido) {
          if (nome === "") {
            campoNome.focus();
          } else {
            campoTelefone.focus();
          }

          return;
        }

        const perfil = {
          nome: nome,

          telefone: telefone,

          informacaoEmergencia: informacaoEmergencia,
        };

        localStorage.setItem(
          chavePerfil,

          JSON.stringify(perfil),
        );

        limparErros();

        const mensagem = document.getElementById("mensagemSucesso");

        mensagem.style.display = "block";

        setTimeout(
          function () {
            mensagem.style.display = "none";
          },

          2500,
        );
      }

      carregarPerfil();
    </script>
  </body>
</html>
